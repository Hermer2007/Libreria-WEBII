<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
    @for (libro of libros(); track libro.id){
    <div class="border-2 border-black-500 bg-yellow-50 rounded-lg">
        <img class="h-auto max-w-full rounded-base mx-auto mt-2" [src]="libro.formats['image/jpeg']" [alt]="libro.title">
        <h2 class="text-center">{{libro.title}}</h2>
        <p class="text-center">{{libro.authors}}</p>

        <details class="mt-3 mb-2 border border-green-400 rounded-lg p-2 bg-green-200 w-60 mx-auto">
                <summary class="cursor-pointer text-center">
                    Ver información
                </summary>

                <p class="mt-2 text-justify">
                    {{libro.summaries}}
                </p>
            </details>
        
    </div>
    }
</div>
